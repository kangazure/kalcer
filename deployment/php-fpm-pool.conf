; =====================================================================
; PHP-FPM Pool Configuration — PT Jaringan Teknologi Sejahtera (JTS)
; Lokasi: /etc/php/8.3/fpm/pool.d/ptjts.conf
; Aktivasi: systemctl restart php8.3-fpm
; =====================================================================

[ptjts]
user = www-data
group = www-data

; Socket khusus (dirujuk di konfigurasi Nginx: fastcgi_pass unix:/run/php/php8.3-fpm-ptjts.sock)
listen = /run/php/php8.3-fpm-ptjts.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ---------------------------------------------------------------------
; Process manager — dynamic cocok untuk traffic ISP dengan pola akses
; bervariasi (lonjakan saat jam kerja/malam). Sesuaikan angka berikut
; dengan kapasitas RAM server (estimasi ~40-60MB per child process).
; ---------------------------------------------------------------------
pm = dynamic
pm.max_children = 25
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10
pm.max_requests = 500

; ---------------------------------------------------------------------
; Timeout & buffer
; ---------------------------------------------------------------------
request_terminate_timeout = 120s
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 20M
php_admin_value[max_execution_time] = 120

; ---------------------------------------------------------------------
; Logging
; ---------------------------------------------------------------------
php_admin_value[error_log] = /var/www/ptjts/storage/logs/php-fpm-error.log
php_admin_flag[log_errors] = on
slowlog = /var/www/ptjts/storage/logs/php-fpm-slow.log
request_slowlog_timeout = 10s

; ---------------------------------------------------------------------
; Keamanan — sembunyikan versi PHP, batasi fungsi berbahaya
; ---------------------------------------------------------------------
php_admin_value[expose_php] = off
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen
