# =====================================================================
# Nginx Server Block — TAHAP 2: Full HTTPS (setelah sertifikat SSL ada)
# PT Jaringan Teknologi Sejahtera (JTS)
#
# JANGAN pakai file ini di awal deploy — akan gagal karena sertifikat
# belum ada (nginx -t error "cannot load certificate"). Deploy
# ptjts.id.http-only.conf dulu, jalankan certbot, baru ganti ke file ini.
# Lihat deployment/README.md bagian "Konfigurasi Nginx" untuk urutan lengkap.
#
# Lokasi: /etc/nginx/sites-available/ptjts.id (menimpa versi http-only)
# =====================================================================

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name rikoardianto.web.id www.rikoardianto.web.id;

    # Izinkan challenge Let's Encrypt certbot tanpa redirect
    location /.well-known/acme-challenge/ {
        root /var/www/ptjts/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Server utama HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rikoardianto.web.id www.rikoardianto.web.id;

    root /var/www/ptjts/public;
    index index.php;

    # ---------------------------------------------------------------
    # SSL — sertifikat dari Let's Encrypt (certbot) atau CA lain
    # ---------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/rikoardianto.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rikoardianto.web.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---------------------------------------------------------------
    # Security Headers (pelengkap App\Http\Middleware\SecurityHeaders,
    # ditambahkan juga di level Nginx sebagai defense-in-depth)
    # ---------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    charset utf-8;

    # ---------------------------------------------------------------
    # Batas ukuran upload (CV lamaran, gambar galeri, dsb)
    # ---------------------------------------------------------------
    client_max_body_size 20M;

    # ---------------------------------------------------------------
    # Logging
    # ---------------------------------------------------------------
    access_log /var/log/nginx/ptjts-access.log;
    error_log  /var/log/nginx/ptjts-error.log warn;

    # ---------------------------------------------------------------
    # Laravel front controller
    # ---------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ---------------------------------------------------------------
    # Cache aset statis (JS/CSS/gambar hasil build Vite, logo, dsb)
    # ---------------------------------------------------------------
    location ~* \.(css|js|mjs|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------------------------------------------------------------
    # PHP-FPM
    # ---------------------------------------------------------------
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-ptjts.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120;
        include fastcgi_params;
    }

    # ---------------------------------------------------------------
    # Blokir akses ke file/folder sensitif
    # ---------------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ ^/(\.env|composer\.(json|lock)|package\.json|artisan|storage/app/private) {
        deny all;
    }

    location ~* /(vendor|node_modules|database|tests|routes|app|bootstrap|config)/ {
        deny all;
    }
}
