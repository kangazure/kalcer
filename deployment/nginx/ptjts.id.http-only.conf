# =====================================================================
# Nginx Server Block — TAHAP 1: HTTP-only (sebelum SSL)
# PT Jaringan Teknologi Sejahtera (JTS)
#
# GUNAKAN FILE INI DULU sebelum menjalankan certbot. Setelah sertifikat
# berhasil didapat, ganti dengan ptjts.id.ssl.conf (lihat deployment/README.md
# bagian "Konfigurasi Nginx" untuk urutan lengkapnya).
#
# Lokasi: /etc/nginx/sites-available/ptjts.id
# Aktivasi: ln -s /etc/nginx/sites-available/ptjts.id /etc/nginx/sites-enabled/
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name rikoardianto.web.id www.rikoardianto.web.id;

    root /var/www/ptjts/public;
    index index.php;

    # Wajib ada SEBELUM certbot dijalankan, agar proses validasi domain
    # (HTTP-01 challenge) bisa diakses Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/ptjts/public;
    }

    client_max_body_size 20M;

    access_log /var/log/nginx/ptjts-access.log;
    error_log  /var/log/nginx/ptjts-error.log warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~* \.(css|js|mjs|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-ptjts.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ ^/(\.env|composer\.(json|lock)|package\.json|artisan|storage/app/private) {
        deny all;
    }

    location ~* /(vendor|node_modules|database|tests|routes|app|bootstrap|config)/ {
        deny all;
    }
}
