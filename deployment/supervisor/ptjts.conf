# =====================================================================
# Supervisor Configuration — PT Jaringan Teknologi Sejahtera (JTS)
# Lokasi: /etc/supervisor/conf.d/ptjts.conf
# Aktivasi: supervisorctl reread && supervisorctl update && supervisorctl start all
# =====================================================================

# ---------------------------------------------------------------------
# Laravel Horizon — dashboard & manager queue worker Redis
# Horizon sendiri menjalankan/mengelola worker sesuai konfigurasi
# config/horizon.php, jadi cukup 1 proses supervisor untuk `horizon`.
# ---------------------------------------------------------------------
[program:ptjts-horizon]
process_name=%(program_name)s
command=php /var/www/ptjts/artisan horizon
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/ptjts/storage/logs/horizon.log
stopwaitsecs=3600

# ---------------------------------------------------------------------
# Laravel Scheduler — menjalankan `schedule:run` setiap menit.
# CATATAN: pendekatan yang lebih umum adalah via crontab (lihat
# deployment/README.md), tapi disediakan juga sebagai alternatif
# supervisor jika environment tidak memiliki akses crontab (mis. container).
# ---------------------------------------------------------------------
[program:ptjts-scheduler]
process_name=%(program_name)s
command=/bin/bash -c "while true; do php /var/www/ptjts/artisan schedule:run --verbose --no-interaction & sleep 60; done"
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/ptjts/storage/logs/scheduler.log

# ---------------------------------------------------------------------
# Grup proses agar bisa start/stop/restart bersamaan: supervisorctl restart ptjts:*
# ---------------------------------------------------------------------
[group:ptjts]
programs=ptjts-horizon,ptjts-scheduler
